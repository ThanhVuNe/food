<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">
<title>Hôm Nay Ăn Gì? — Vòng xoay đồ ăn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- cục nền trang trí -->
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<!-- nút bật/tắt âm thanh -->
<button class="mute-btn" id="muteBtn" type="button" aria-label="Bật/tắt âm thanh">🔊</button>

<main class="app">

  <!-- ============ MÀN 1: CHỌN LOẠI ============ -->
  <section class="screen is-active" id="screenSelect">
    <header class="head">
      <h1 class="title">Hôm Nay Ăn Gì?</h1>
      <p class="subtitle">🌀 Để vòng xoay quyết định giúp bạn!</p>
    </header>

    <div class="cards">
      <button class="cat-card" data-cat="no" type="button">
        <span class="emoji-wrap grad-orange">🍜</span>
        <span class="label">Thức ăn no</span>
        <span class="desc">Bún, phở, cơm, bánh mì…</span>
      </button>
      <button class="cat-card" data-cat="fast" type="button">
        <span class="emoji-wrap grad-pink">🍕</span>
        <span class="label">Thức ăn nhanh</span>
        <span class="desc">Gà rán, mì Hàn, pizza…</span>
      </button>
    </div>

    <p class="tip">💡 Mẹo: thêm / sửa món ăn trong file <code>script.js</code></p>
  </section>

  <!-- ============ MÀN 2: VÒNG XOAY ============ -->
  <section class="screen" id="screenWheel">
    <header class="wheel-head">
      <button class="icon-btn" id="backBtn" type="button" aria-label="Quay lại">←</button>
      <span class="cat-title" id="catTitle">🍜 Thức ăn no</span>
      <span class="icon-btn ghost" aria-hidden="true"></span>
    </header>

    <div class="wheel-stage" id="wheelStage">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheelCanvas" width="360" height="360" aria-label="Vòng xoay đồ ăn"></canvas>
      <button class="spin-btn" id="spinBtn" type="button">QUAY</button>
    </div>

    <p class="wheel-tip">👆 Bấm <strong>QUAY</strong> để tìm món cho hôm nay!</p>
  </section>

</main>

<!-- ============ MÀN 3: KẾT QUẢ (overlay) ============ -->
<section class="overlay" id="screenResult">
  <div class="result-bg"></div>

  <div class="result-card" id="resultCard">
    <div class="face back">🎲</div>
    <div class="face front">
      <span class="res-emoji" id="resEmoji">🍜</span>
      <span class="res-name" id="resName">Phở bò</span>
    </div>
  </div>

  <div class="result-actions">
    <button class="btn btn-ghost" id="changeBtn" type="button">📑 Đổi loại</button>
    <button class="btn btn-primary" id="againBtn" type="button">🔁 Quay lại</button>
  </div>
</section>

<!-- canvas pháo giấy -->
<canvas class="confetti" id="confettiCanvas" aria-hidden="true"></canvas>

<script src="script.js"></script>
</body>
</html>
